[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypermax"
version = "0.6.0"
description = "Hyperparameter optimization with TPE, Adaptive-TPE, and Hyperband"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Bradley Arsenault", email = "brad@electricbrain.io" },
]
keywords = ["hyperparameter", "optimization", "machine-learning", "hyperopt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
]
dependencies = [
  "hyperopt>=0.2.7",
  "jsonschema>=4.17",
  "lightgbm>=4.0",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "panwid>=0.3.5,<0.4",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "urwid>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
hypermax = "hypermax.cli:main"

[project.urls]
Homepage = "https://github.com/electricbrainio/hypermax"
Repository = "https://github.com/electricbrainio/hypermax"

[tool.setuptools.packages.find]
include = ["hypermax*"]

[tool.setuptools.package-data]
hypermax = ["atpe_models/*.txt", "atpe_models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
  "slow: integration tests intended for the auxiliary Linux hosts",
]
